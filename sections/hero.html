<style>
    .projects-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        padding: 0;
        list-style: none;
    }

    @media (max-width: 1024px) {
        .projects-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 768px) {
        .projects-list {
            grid-template-columns: repeat(1, minmax(0, 1fr));
        }
    }

    .projects-list > * {
        width: 100%;
    }

    .project-card {
        width: 100%;
        list-style: none;
        padding: 32px;
        background: var(--color-base-hover);

        .project-title {
            color: var(--color-secondary);
        }
        .project-description {
            color: var(--text-secondary);
        }
    }

    .project-card:hover {
        transform: translateY(-12px);
        transition: transform .3s;
        z-index: 1000;
        .project-title,
        .project-tag  {
            color: var(--color-primary);
        }
        .project-feature-icon {
            fill: var(--color-primary);
        }

        .project-description {
            color: var(--text-primary);
        }
    }

    .project-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        fill: var(--text-secondary);
    }

    .project-action-link:hover {
        fill: var(--color-primary);
    }

    .project-card ul {
        list-style: none;
    }

    .project-card ul li {
        color: white;
    }

    .project-tags {
        list-style: none;
        padding: 0;
        margin: 0;
        letter-spacing: 0;
        display: flex;
    }

    li.project-tag {
        color: white;
        padding: 12px;
        width: fit-content;
        overflow: hidden;
        white-space: nowrap;
        border-radius: 12px;
        letter-spacing: 0;
    }

    li.project-tag:first-child {
        color: white;
        padding-left: 0;
    }

    .project-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
    }

    ul.project-platforms {
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: center;
        padding-left: 0;
    }

    li.project-platform-item {
        color: var(--color-primary);
        border: 1px solid var(--color-primary);
        padding: 6px;
        display: flex;
        border-radius: 4px;
        min-width: 80px;
        width: fit-content;
        justify-content: center;
    }

    li.project-platform-item:hover {
        transform: translateY(-2px);
        transition: transform .3s;
    }

</style>

<section id="projects-section" class="projects-section">
    <div id="projects"></div>
</section>
